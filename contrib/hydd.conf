# hydd - read-only Hydrus Public Tag Repository mirror
#
# Default location: /etc/hydd.conf
# Reload requires a restart: systemctl restart hydd
#
# Values are `key = value`. `#` and `;` start comments.

# Where the tag database, state, and update cache live. The daemon runs as the
# unprivileged `hyd` user; this directory must be writable by that user.
# systemd's StateDirectory creates /var/lib/hyd automatically. If you change
# this path, add a matching ReadWritePaths= line to hydd.service because the
# unit uses ProtectSystem=strict.
data_dir = /var/lib/hyd

# Storage format.
#
# hydd uses a compact read-only columnar store, roughly 25-30 GB for a full
# PTR mirror, with fast queries and low RAM. This is a mirror schema, not
# byte-identical to a Hydrus client or server database. Hydrus itself uses
# SQLite, but a client splits it across several files with a client-specific
# schema, and a fully synced client image is roughly 160 GB extracted.
#
# Use a fresh data_dir if you want to rebuild the store from scratch.

# API listener. Keep it on loopback unless you really know what you are doing.
# hydd speaks plain HTTP; put a TLS reverse proxy in front for remote access.
listen_address = 127.0.0.1
listen_port = 45869

# One or more 64-character hexadecimal API keys, separated by commas. Leave
# empty to read keys from access_key_file, one per line; blank lines and lines
# starting with # are ignored. The file is generated with one key on first
# start. Prefer the file here because this config is world-readable.
access_key =
access_key_file = /var/lib/hyd/api_access_key

# By default, connections whose TCP peer is loopback (127.0.0.1 or ::1) skip
# the API key check, and a bogus key is ignored as well. This lets local CLI
# tools run unprivileged. Set this to true to require a valid access key from
# localhost too. The check uses the real socket peer, not X-Forwarded-For.
# If a public reverse proxy connects from loopback, loopback trust makes the
# read-only API public through that proxy.
require_localhost_key = false

# Stable service key reported by /get_services for the tag repository. Leave
# empty to generate one on first start.
service_key =
service_key_file = /var/lib/hyd/service_key

# Human-readable name reported by the API for the tag service.
service_name = public tag repository

# The community repository. The PTR is a centralized Hydrus server, not
# peer-to-peer. This is the public read-only access key. Syncing requires
# https; plain http is accepted only for a loopback host (local tests).
repository_url = https://ptr.hydrus.network:45871
repository_access_key = 4a285629721ca442541ef2c15ea17d1f7f7578b0c3f4f5f2a05f8f0ab297786f

# Sync behaviour.
sync_enabled = true
sync_on_start = true
sync_interval_seconds = 3600

# Number of partitions used by the custom store. Must be a power of two.
# Higher values use less RAM while building but require more passes over the
# downloaded update files. 16 is a good default for 8-16 GiB machines.
partitions = 16

# Custom-store compaction: merge the append-only delta journal into the
# immutable base store once it grows past this size. This keeps startup memory
# flat and reclaims delta space. It never deletes live tags or mappings. Set
# compaction_enabled = false to keep the delta journal untouched (for example,
# if you want to archive the raw incremental history). Default: enabled.
compaction_enabled = true
compact_after_delta_mb = 512

# Keep the downloaded update files after a successful initial build. Disable
# (default) to reclaim several GiB. Enable when debugging the importer, when
# you want a raw archive of the repository stream, or when you want to serve
# the read-only /metadata and /update relay from a complete cache.
keep_update_cache = false

# Verify cached update files and heal bit rot. When a relay request finds a
# file that no longer matches its hash, hydd re-downloads it. When /metadata
# finds an incomplete cache, hydd runs a full verification pass (at most once
# per ten minutes). The sync path also verifies the files it is about to use.
# Repair only rewrites cache files; it never modifies the query store.
# Default: enabled.
repair_enabled = true

# Derived tag metadata for GET/POST /hydd/tag_counts. This writes
# store/counts.bin (4 bytes per defined tag id) and store/tag_lookup.bin
# (8 bytes per defined tag id), roughly 660 MB at 55 million tags. The first
# start after upgrading from 0.7.x builds them in a one-time scan; you can also
# run `hydd --rebuild-tag-counts`. Counts are exact storage-tag mapping counts
# and include the pending delta journal; siblings and parents are not expanded.
tag_counts_enabled = true

# Ordinarily the base counts are only rewritten by compaction, and the pending
# delta journal is applied in memory, so every sync is already reflected in the
# API without another scan. Set this to true only if you really want a full
# recount after every sync pass (it re-reads every partition).
tag_counts_rebuild_after_sync = false

# Public-instance limits.
#
# max_connections bounds concurrent sockets; excess connections get 503 with
# Retry-After. Requests themselves are rate limited per access key (or per peer
# address when unauthenticated) with a token bucket: the sustained rate plus a
# burst allowance. A limited client gets 429 with Retry-After.
max_connections = 128
rate_limit_enabled = true
rate_limit_requests_per_minute = 600
rate_limit_burst = 120

# Loopback peers are not exempt by default, because a reverse proxy makes
# public traffic look like it came from 127.0.0.1. Set this to true only when
# the listener is genuinely local and you want local batch tools to skip the
# bucket.
rate_limit_local_bypass = false

# The PTR has exactly four hash-table values that are not valid hashes and can
# never be queried. hydd logs and skips those four known values; any other
# invalid value still aborts the sync.

# Network.
# Update files are downloaded with a small worker pool. Each worker keeps one
# TLS connection alive and reuses it.
download_workers = 8
download_timeout_seconds = 120
download_rate_limit_kib = 0

# Abort a sync after this many bytes have been downloaded. The default is
# 64 GiB, roughly three times the current PTR corpus; set 0 for no limit.
# max_download_bytes = 68719476736

# trace, debug, info, warn, error, off
log_level = info

# Rotating log file. systemd also keeps stdout/stderr in the journal.
# Rotation happens when the plaintext file reaches log_rotate_mb, old files
# are gzipped, and log_rotate_keep compressed files are retained.
# Set log_file = (empty) to disable file logging.
log_file = /var/log/hyd/hyd.log
log_rotate_mb = 10
log_rotate_keep = 5
log_rotate_compress = true

# ---------------------------------------------------------------------------
# Test / development limits
#
# The full PTR is far larger than a test run needs. Any automated or manual
# test against the real PTR must stay under 10 GiB of downloads. Use
# max_update_index plus an explicit max_download_bytes above; they produce a
# deliberately partial store.
# ---------------------------------------------------------------------------
# max_update_index = 100

# The above settings are the complete set currently understood by hydd.
